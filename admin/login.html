<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#090909"
    >

    <title>Reelivo— Admin Login</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #090909;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #111;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 32px;
            box-sizing: border-box;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .login-logo {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #090909;
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 22px;
        }

        .login-title {
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .login-subtitle {
            margin: 0 0 28px;
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: #181818;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: rgba(255,255,255,.35);
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 10px;
            background: #fff;
            color: #090909;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .login-message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        #loginError {
            background: rgba(220, 50, 50, .12);
            color: #ff8585;
            border: 1px solid rgba(220, 50, 50, .2);
        }

        #loginSuccess {
            background: rgba(50, 190, 110, .12);
            color: #78e0a5;
            border: 1px solid rgba(50, 190, 110, .2);
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #fff;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,.25);
            border-top-color: #000;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }

            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <div class="login-card">

                <div class="login-logo">
                    SB
                </div>

                <h1 class="login-title">
                    Admin Login
                </h1>

                <p class="login-subtitle">
                    Sign in to manage your StreamBox platform.
                </p>


                <form id="adminLoginForm">

                    <div class="form-group">

                        <label for="adminEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            placeholder="admin@example.com"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >

                        <span id="loginButtonText">
                            Sign In
                        </span>

                        <span
                            id="loginSpinner"
                            class="spinner hidden"
                        ></span>

                    </button>

                </form>


                <div
                    id="loginError"
                    class="login-message hidden"
                ></div>


                <div
                    id="loginSuccess"
                    class="login-message hidden"
                ></div>


                <a
                    href="../index.html"
                    class="back-link"
                >
                    ← Back to Reelivo
                </a>

            </div>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Admin JavaScript -->
    <script src="admin.js"></script>

</body>
</html>
